name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Pack
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release

      - name: Smoke test
        run: |
          npm install --global --prefix "$RUNNER_TEMP/blueprint" ./release/*.tgz
          "$RUNNER_TEMP/blueprint/bin/blueprint" --version

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --generate-notes --verify-tag

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish package to npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          asset="samzong-blueprint-${GITHUB_REF_NAME#v}.tgz"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir release
          npm publish "release/$asset" --access public
