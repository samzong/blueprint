name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Pack
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release

      - name: Smoke test
        run: |
          npm install --global --prefix "$RUNNER_TEMP/blueprint" ./release/*.tgz
          "$RUNNER_TEMP/blueprint/bin/blueprint" --version

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --generate-notes --verify-tag

  publish-npm:
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish package to npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          mkdir release
          asset="samzong-blueprint-${RELEASE_TAG#v}.tgz"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir release
          npm publish "./release/$asset" --access public
