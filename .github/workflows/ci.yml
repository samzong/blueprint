name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node dist/bin.js create dossier .local/ci-dossier
      - run: pnpm --dir .local/ci-dossier install --no-frozen-lockfile
      - run: pnpm --dir .local/ci-dossier build
